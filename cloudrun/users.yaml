apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: users
  annotations:
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: "true"
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 80
      containers:
      - image: gcr.io/PROJECT_ID/users
        ports:
        - containerPort: 8080
        env:
        - name: USERS_ADDR
          value: ":8080"
        - name: USERS_LOG_FORMAT
          value: "json"
        - name: USERS_LOG_LEVEL
          value: "info"
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
  traffic:
  - latestRevision: true
    percent: 100
