# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

dotenv: ['.env']

vars:
  GREETING: Hello, world!

tasks:
  init:
    desc: Initialize git submodules after a fresh clone
    cmds:
      - git submodule update --init --recursive

  update-submodules:
    desc: Pull latest changes from all submodule remotes
    cmds:
      - git submodule update --remote --merge

  default:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"
    silent: true
  
  run-gateway:
      desc: Run API GATEWAY
      cmds:
          - cd api-gateway && go run cmd/gateway/main.go

  dev-gateway:
      desc: Run API GATEWAY
      cmds:
          - cd api-gateway && air

  run-service-user:
    desc: Run User service
    cmds:
      - echo "{{.GREETING}}"
      - cd services/users && go run .

  dev-service-user:
      desc: Run User service dev
      cmds:
          - cd services/users && air

  run-service-kitchen:
    desc: Run Kitchen service
    cmds:
      - cd services/kitchen && go run .

  dev-service-kitchen:
    desc: Run Kitchen service dev
    cmds:
      - cd services/kitchen && air

  run-service-god:
    desc: Run God service
    cmds:
      - cd services/p22194-god-svc && go run .

  dev-service-god:
    desc: Run God service dev
    cmds:
      - cd services/p22194-god-svc && air

  run-service-mail:
    desc: Run Mail service
    cmds:
      - cd services/mail && set -a && . ../../.env && set +a && go run .

  dev-service-mail:
    desc: Run Mail service dev
    cmds:
      - cd services/mail && air

  dev-client-god:
    desc: Run God client dev
    cmds:
      - cd clients/p22194-god-client && bun run dev

  dev-client-kitchen:
    desc: Run Kitchen client dev
    cmds:
      - cd clients/kitchen-client && bun run dev

  dev-client-find-my-trip:
    desc: Run Find My Trip client dev
    cmds:
      - cd clients/find-my-trip-client && bun run dev

  run-service-find-my-trip:
    desc: Run Find My Trip service
    cmds:
      - cd services/find-my-trip && .venv/bin/uvicorn main:app --port 8000

  dev-service-find-my-trip:
    desc: Run Find My Trip service dev with hot reload
    cmds:
      - cd services/find-my-trip && .venv/bin/uvicorn main:app --port 8000 --reload

  dev:
    desc: Run all services concurrently (gateway, kitchen, mail, client)
    deps:
      - dev-gateway
      - dev-service-kitchen
      - dev-service-mail
      - dev-client-kitchen
