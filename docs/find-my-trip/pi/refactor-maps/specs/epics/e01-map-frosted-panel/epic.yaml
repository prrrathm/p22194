epic_slug: "map-frosted-panel"
created: 2026-07-08
status: planned
priority: P0
bcps: 13

## Epic Rationale
Visual foundation: MapLibre interactive map on left, frosted glass results panel on right. Apple-style design (glassmorphism, SF Pro font, subtle shadows). This epic provides the container for all data display and user interaction.

## Key Decisions
- **Map Library**: MapLibre GL JS (open-source, no API key required)
- **Styling**: TailwindCSS v4 + custom glassmorphism components
- **Layout**: Flexbox, left 60% (map), right 40% (panel)
- **Responsive**: Desktop-first (1024px+); mobile in v1.1

## Dependencies
- maplibre-gl (adds ~300KB gzipped)
- TailwindCSS (existing)
- React Router (existing)

---

