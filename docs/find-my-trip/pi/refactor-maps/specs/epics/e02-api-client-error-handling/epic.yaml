## Testing Strategy (TEA - Time/Edge-cases/Assumptions)

### Time-based
- Unit tests run in <1s (mocked HTTP)
- Integration tests run in <10s (real HTTP to localhost:8000)

### Edge Cases
- Empty response (no results)
- Malformed JSON
- Missing fields in response
- Invalid coordinates before API call
- Network timeout
- 5xx server errors
- CORS errors

### Assumptions
- Backend at localhost:8000 is running and accessible
- Backend follows Pydantic schema exactly
- CORS is enabled on backend (already configured)

---

## Integration Audit Checklist

Before e03 (map click integration) begins, audit that:

- [ ] Fetch wrapper handles all HTTP error codes (2xx, 4xx, 5xx)
- [ ] Schema validation rejects malformed responses
- [ ] Retry logic doesn't retry non-transient errors (4xx)
- [ ] Error messages are user-friendly (no stack traces in UI)
- [ ] TypeScript strict mode passes
- [ ] Zod version pinned (not ^major)
- [ ] No unhandled promise rejections
- [ ] Timeout works (manual test: add 10s delay to backend endpoint)
- [ ] CORS preflight works (OPTIONS request succeeds)
- [ ] Content-Type header correct (application/json)

