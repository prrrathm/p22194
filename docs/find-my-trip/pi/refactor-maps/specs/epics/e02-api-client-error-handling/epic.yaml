## Epic Rationale
API client is the foundation for all data flow. Robust error handling + schema validation prevent silent failures and ensure type safety across the client-service boundary. This epic is blocking for e03 (map click integration) and e04 (results display).

## Key Decisions
- **API Client Pattern**: Simple fetch wrapper (no axios, tRPC, GraphQL)
- **Error Handling**: Custom error class + retry logic for transient failures
- **Schema Validation**: Zod runtime validators for all API responses
- **Type Safety**: Full TypeScript with strict mode enabled
- **Configuration**: Environment-based API base URL (.env)

## Acceptance Criteria
- ✅ Fetch wrapper correctly calls all 3 endpoints
- ✅ Error handling covers 5 scenarios (network, timeout, validation, empty, schema)
- ✅ Zod schemas validate responses at runtime
- ✅ TypeScript strict mode passes
- ✅ Unit tests cover happy path + all error paths
- ✅ Integration test against live backend (localhost:8000) passes
- ✅ Retry logic works for transient errors

## Dependencies
- `zod` package (adds ~15KB gzipped)
- React hooks (useState, useEffect)
- Existing: TypeScript, React Router

