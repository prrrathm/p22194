## Definition of Done (Story Level)

story_dod:
  - ✅ Red-green-refactor TDD cycle complete
  - ✅ Unit + integration tests pass
  - ✅ TypeScript typecheck passes
  - ✅ Linter (Prettier/ESLint) passes
  - ✅ Verify-work UAT checklist complete
  - ✅ audit-code passes (non-optional gate)
  - ✅ No console errors/warnings
  - ✅ Browser tested (Chrome, Firefox, Safari)
  - ✅ Accessibility baseline (WCAG 2.1 Level A)

## Definition of Done (Epic Level)

epic_dod:
  - ✅ All stories in epic pass DOD
  - ✅ Integration tests between stories pass
  - ✅ API contract validation passes
  - ✅ Security threat model reviewed
  - ✅ Conventional Commits drafted
  - ✅ PR opened (or ready to land)
  - ✅ Traceability matrix updated
  - ✅ Release notes drafted

