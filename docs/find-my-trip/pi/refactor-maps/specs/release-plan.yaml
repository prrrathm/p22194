## Phase Gates

phase_gates:
  - phase: DISCOVER (Complete)
    status: ✅
    checklist:
      - survey-context
      - scope-work
      - research-first
      - elaborate-spec
      - plan-release
      - slice-tasks

  - phase: PLAN (In Progress)
    status: 🔄
    checklist:
      - plan-work (e01-e05)
      - define-language (ubiquitous domain model)
      - plan-tests (risk-based test strategy)

  - phase: BUILD (Ready)
    status: ⏳
    checklist:
      - build-epic (one epic per execution)
      - security-review (threat model)
      - develop-tdd (vertical slices)
      - verify-work (UAT + gates)

  - phase: VERIFY (Ready)
    status: ⏳
    checklist:
      - audit-code (quality gate)
      - enforce-first (test quality)
      - request-review (independent review)
      - validate-contracts (API schema)

  - phase: RELEASE (Ready)
    status: ⏳
    checklist:
      - commit-message (Conventional Commits)
      - release-branch (PR/land)
      - trace-requirement (traceability matrix)

