## Command Reference

commands:
  start_first_epic: |
    # Set active epic to e02 (API client, highest WSJF)
    bash scripts/bp-yaml-set.sh active_flow build_epic
    bash scripts/bp-yaml-set.sh active_epic e02
    # Then run build-epic skill
  
  check_status: |
    cat specs/state.yaml
    cat specs/execution-status.yaml
  
  resume_epic: |
    # Set to resume current epic at current step
    # build-epic will read epic_cycle.current_step and run only that step
    build-epic
  
  run_full_auto: |
    # Build entire epic without user checkpoints
    build-epic --auto
  
  fast_mode: |
    # Coalesce read-and-report steps (8 invocations → 6)
    build-epic --fast

