- TailwindCSS (existing)

## Non-Functional Requirements

| Requirement | Target | Rationale |
|---|---|---|
| **Time to Interactive** | <2s | User expects snappy map load |
| **API Response Time** | <5s per endpoint | Timeout threshold |
| **Map Pan/Zoom** | 60fps | Smooth interactions |
| **Accessibility (WCAG)** | AA (post-MVP) | Legal requirement |
| **Bundle Size Delta** | <150KB (gzipped) | Keep lean client |

## Assumptions

1. Backend service is deployed and running at http://localhost:8000
2. Backend CORS is enabled (already configured in FastAPI app)
3. MapLibre can be self-hosted or CDN loaded
4. API responses always follow the Pydantic schema (no malformed JSON)
5. Latitude/longitude coordinates are always valid (backend validates)

## Risks

| Risk | Impact | Mitigation |
|---|---|---|
| Backend API downtime | 🔴 HIGH | Implement error messages + health check endpoint call |
| MapLibre rendering issues | 🟡 MEDIUM | Test on Chrome, Firefox, Safari; use known stable version |
| CORS failures | 🔴 HIGH | Verify CORS config on backend; use OPTIONS pre-flight |
| Slow API response | 🟡 MEDIUM | Add timeout + show loading state |
| Schema mismatch | 🔴 HIGH | Validate with Zod at runtime; audit with Postman |

