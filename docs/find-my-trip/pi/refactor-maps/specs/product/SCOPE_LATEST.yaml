## Overview
Client application for @services/find-my-trip backend service. Users click on a map location to discover group tours, places to see, and activities at that location.

## In Scope

### UI/UX
- Interactive MapLibre map (left side, 60% width)
- Right-side frosted glass panel (40% width) for results display
- Apple-style design language: glassmorphism, SF Pro font, subtle shadows
- Responsive on desktop (1024px+); mobile breakpoint planned post-MVP

### Map Interactions
- Pan, zoom, drag capabilities
- Click handler: lat/lng captured on map click
- Visual feedback: cursor change, click animation
- Attribution & watermarks per MapLibre license

### API Integration
- Simple fetch wrapper (no axios/tRPC complexity)
- Three endpoints: /location/group, /location/places, /location/activities
- Request: { latitude: number, longitude: number }
- Response: { results: [{ title, url, snippet }] }
- Base URL: http://localhost:8000 (configurable via .env)

### Data Handling & Display
- Single unified results panel: displays results from all 3 endpoints
- Result card layout with title, snippet, link/CTA
- Category badges (group tour / place / activity)
- Sorted by relevance/API order

### Error Handling (Critical)
- Network errors: user-friendly message + retry button
- Timeout handling (5s per endpoint)
- Invalid coordinates: validation before API call
- Empty results: "No results found" message
- API schema validation: ensure response matches LocationResponse shape
- Graceful degradation if one endpoint fails (others still show)

### Loading States
- Spinner during API fetch (per endpoint or unified?)
- Disable map during fetch (or allow re-clicking?)
- Progressive result display (as each category loads)

## Out of Scope

