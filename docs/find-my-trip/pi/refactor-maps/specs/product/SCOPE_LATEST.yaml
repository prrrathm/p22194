- Geolocation (auto-detect user location) — **v1.1**
- Result filtering/search bar — **v1.1**
- Map markers/pins for results — **v1.1**
- Result bookmarking/favorites — **v2.0**
- Responsive mobile UI (<1024px) — **v1.1**
- Map styles/theming customization — **v2.0**
- Authentication/user accounts — **future**
- Itinerary creation — **future**

### Technical Debt
- PWA/offline support — **future**
- API response caching/SWR — **v1.1**
- Analytics tracking — **future**

## Key Decisions

1. **Map Library**: MapLibre GL JS (open-source, no API key required for basic usage)
2. **Styling**: TailwindCSS v4 + custom glassmorphism components (existing in project)
3. **API Client**: Vanilla fetch with custom error handler (no deps)
4. **State Management**: React hooks (useState/useEffect) — no Redux/Zustand
5. **Type Safety**: Full TypeScript with Zod schema validation
6. **Testing Strategy**: 
   - Unit tests for API client error handling
   - Integration tests for client↔service contract
   - E2E validation: Postman collection against live endpoints

